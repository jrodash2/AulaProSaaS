{% extends 'base.html' %}{% block content %}<h1>Tipos de evaluación</h1><form method="post" class="panel form-grid">{% csrf_token %}<input class="form-control" name="nombre" required placeholder="Nombre"><input class="form-control" name="codigo" required placeholder="Código"><textarea class="form-control field-wide" name="descripcion" placeholder="Descripción"></textarea><button class="btn btn-primary">Crear tipo</button></form><section class="panel">{% for t in tipos %}<p><strong>{{ t.nombre }}</strong> · {{ t.codigo }}</p>{% endfor %}</section>{% endblock %}
