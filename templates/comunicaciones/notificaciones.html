{% extends 'base.html' %}{% block content %}<div class="page-heading"><div><span class="eyebrow">Centro de notificaciones</span><h1>Notificaciones</h1></div><form method="post" action="{% url 'comunicaciones:marcar_todas' %}">{% csrf_token %}<button class="btn btn-light">Marcar todas como leídas</button></form></div><nav class="ap-tabs"><a href="{% url 'comunicaciones:notificaciones' %}">Todas</a><a href="?filtro=no-leidas">No leídas</a></nav><div class="notification-list">{% for n in notificaciones %}<a class="panel notification-item {% if not n.leida %}unread{% endif %}" href="{% url 'comunicaciones:abrir_notificacion' n.pk %}"><i class="bi bi-bell"></i><div><strong>{{ n.titulo }}</strong><p>{{ n.mensaje }}</p></div><time>{{ n.fecha_creacion|timesince }}</time></a>{% empty %}<div class="ap-empty">No tienes notificaciones.</div>{% endfor %}</div>{% endblock %}
