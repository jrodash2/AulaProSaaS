<div class="field {% if wide %}field-wide{% endif %} {% if field.errors %}has-error{% endif %}"><label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %}<span aria-hidden="true">*</span>{% endif %}</label>{{ field }}{% if field.help_text %}<small class="field-help">{{ field.help_text }}</small>{% endif %}{% for error in field.errors %}<span class="field-error"><i class="bi bi-exclamation-circle"></i>{{ error }}</span>{% endfor %}</div>
