<div class="logo-uploader"><div class="logo-preview" id="{{ preview_id }}">{% if field.value %}<img src="{{ field.value.url }}" alt="{{ title }} actual">{% else %}<i class="bi bi-image"></i><span>Sin imagen</span>{% endif %}</div><div><label for="{{ field.id_for_label }}">{{ title }}</label><p>PNG, JPG o WebP. Máximo 2 MB.</p><label class="btn-ap-light upload-button" for="{{ field.id_for_label }}"><i class="bi bi-upload"></i> Cambiar logo</label><div class="visually-hidden">{{ field }}</div>{% for error in field.errors %}<span class="field-error"><i class="bi bi-exclamation-circle"></i>{{ error }}</span>{% endfor %}</div></div>
