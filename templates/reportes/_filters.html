<form class="panel report-filters no-print" method="get"><div><label class="form-label" for="ciclo">Ciclo</label><select class="form-select" id="ciclo" name="ciclo"><option value="">Seleccionar</option>{% for c in ciclos %}<option value="{{ c.pk }}" {% if c == ciclo_seleccionado %}selected{% endif %}>{{ c.nombre }}</option>{% endfor %}</select></div><div><label class="form-label" for="grado">Grado</label><select class="form-select" id="grado" name="grado"><option value="">Todos</option>{% for g in grados %}<option value="{{ g.pk }}" {% if request.GET.grado == g.pk|stringformat:'s' %}selected{% endif %}>{{ g.nombre }}</option>{% endfor %}</select></div><div><label class="form-label" for="seccion">Sección</label><select class="form-select" id="seccion" name="seccion"><option value="">Todas</option>{% for s in secciones %}<option value="{{ s.pk }}" {% if request.GET.seccion == s.pk|stringformat:'s' %}selected{% endif %}>{{ s }}</option>{% endfor %}</select></div>{% if fechas %}<div><label class="form-label" for="desde">Desde</label><input class="form-control" type="date" id="desde" name="desde" value="{{ request.GET.desde }}"></div><div><label class="form-label" for="hasta">Hasta</label><input class="form-control" type="date" id="hasta" name="hasta" value="{{ request.GET.hasta }}"></div>{% endif %}<button class="btn btn-primary">Aplicar filtros</button></form>
