{% extends 'base.html' %}{% block content %}<div class="page-heading"><h1>Categorías de seguimiento</h1><a class="btn btn-primary" href="{% url 'seguimiento:categoria_nueva' %}">Nueva categoría</a></div><section class="panel"><table class="table"><thead><tr><th>Código</th><th>Nombre</th><th>Tipo</th><th></th></tr></thead><tbody>{% for x in items %}<tr><td>{{ x.codigo }}</td><td>{{ x.nombre }}</td><td>{{ x.get_tipo_display }}</td><td><a href="{% url 'seguimiento:categoria_editar' x.pk %}">Editar</a></td></tr>{% endfor %}</tbody></table></section>{% endblock %}
