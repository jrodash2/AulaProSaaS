{% if ciclos %}<form method="get" class="cycle-selector"><label for="cicloSelector">Ciclo:</label><select class="form-select" id="cicloSelector" name="ciclo" onchange="this.form.submit()">{% for item in ciclos %}<option value="{{ item.pk }}" {% if ciclo.pk == item.pk %}selected{% endif %}>{{ item.nombre }}{% if item.es_actual %} · Actual{% endif %}</option>{% endfor %}</select></form>{% endif %}
