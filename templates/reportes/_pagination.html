{% if page.has_other_pages %}<nav class="report-pagination no-print" aria-label="Paginación">{% if page.has_previous %}<a class="btn btn-light" href="?{{ querystring }}&page={{ page.previous_page_number }}">Anterior</a>{% endif %}<span>Página {{ page.number }} de {{ page.paginator.num_pages }}</span>{% if page.has_next %}<a class="btn btn-light" href="?{{ querystring }}&page={{ page.next_page_number }}">Siguiente</a>{% endif %}</nav>{% endif %}
